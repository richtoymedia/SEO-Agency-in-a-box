version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: seo_agency
      POSTGRES_USER: seo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seo_pass_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo -d seo_agency"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://seo:${POSTGRES_PASSWORD:-seo_pass_change_me}@postgres:5432/seo_agency
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: always
    command: ["pnpm", "worker"]
    environment:
      DATABASE_URL: postgresql://seo:${POSTGRES_PASSWORD:-seo_pass_change_me}@postgres:5432/seo_agency
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Run migrations on startup
  migrate:
    build: .
    command: ["npx", "prisma", "db", "push", "--skip-generate"]
    environment:
      DATABASE_URL: postgresql://seo:${POSTGRES_PASSWORD:-seo_pass_change_me}@postgres:5432/seo_agency
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
